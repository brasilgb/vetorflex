services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-omnichannel}
            MYSQL_USER: ${DB_USERNAME:-omnichannel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        ports:
            - '${MYSQL_PORT:-33076}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-p$${MYSQL_ROOT_PASSWORD}',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
    redis:
        image: redis:7-alpine
        ports:
            - '${REDIS_PORT_FORWARD:-36379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
    worker:
        image: php:8.4-cli
        working_dir: /var/www/html
        command: php artisan queue:work redis --tries=3 --timeout=90
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
volumes:
    mysql-data:
    redis-data:
